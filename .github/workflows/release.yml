name: Release

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing numeric x.x.x git tag to publish or repair
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NOTEMD_RELEASE_WORKFLOW_SOURCE_BRANCH: main
  NOTEMD_RELEASE_CHRONICLE_TARGET_BRANCH: main
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.resolve_tag.outputs.tag_name }}

    steps:
      - name: Check out workflow sources
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.NOTEMD_RELEASE_WORKFLOW_SOURCE_BRANCH }}

      - name: Resolve tag name
        id: resolve_tag
        shell: bash
        env:
          REQUESTED_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node scripts/release/validate-release-tag.js "$REQUESTED_TAG"
          echo "tag_name=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
          echo "TAG_NAME=$REQUESTED_TAG" >> "$GITHUB_ENV"

      - name: Check out release ref
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.resolve_tag.outputs.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Chromium
        run: npx --no-install playwright install --with-deps chromium

      - name: Install the exporter Chromium revision
        run: node node_modules/playwright-chromium/cli.js install chromium

      - name: Build plugin
        run: npm run build

      - name: Run test suite
        run: npm test -- --runInBand

      - name: Audit UI i18n surfaces
        run: npm run audit:i18n-ui

      - name: Audit render-host bundle packaging
        run: npm run audit:render-host

      - name: Check diff hygiene
        run: git diff --check

      - name: Publish or repair GitHub release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run release:github -- "$TAG_NAME"

  refresh_chronicle:
    needs: publish
    runs-on: ubuntu-latest
    env:
      TAG_NAME: ${{ needs.publish.outputs.tag_name }}

    steps:
      - name: Check out chronicle target branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ env.NOTEMD_RELEASE_CHRONICLE_TARGET_BRANCH }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Refresh quarterly development chronicle
        run: node scripts/repo-saga/update-quarterly-saga.mjs --tag "$TAG_NAME"

      - name: Commit chronicle refresh
        run: node scripts/release/commit-chronicle-refresh.js "$TAG_NAME" --target-branch "$NOTEMD_RELEASE_CHRONICLE_TARGET_BRANCH"
