<svg xmlns="http://www.w3.org/2000/svg" width="758" height="574" viewBox="0 0 758 574" role="img" aria-labelledby="notemd-gallery-process-release-title notemd-gallery-process-release-desc" data-notemd-renderer="notemd-reference-layouts@1.1.0" data-layout-safety="notemd-layout-safety@1.0.0">
        <title id="notemd-gallery-process-release-title">Release process</title>
        <desc id="notemd-gallery-process-release-desc">Use for a staged multi-actor process where handoffs matter more than payload types.</desc>
        <style>
