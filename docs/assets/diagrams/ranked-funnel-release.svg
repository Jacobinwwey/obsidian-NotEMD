<svg xmlns="http://www.w3.org/2000/svg" width="920" height="392" viewBox="0 0 920 392" role="img" aria-labelledby="notemd-gallery-ranked-funnel-release-title notemd-gallery-ranked-funnel-release-desc" data-notemd-renderer="notemd-reference-layouts@1.1.0" data-layout-safety="notemd-layout-safety@1.0.0">
        <title id="notemd-gallery-ranked-funnel-release-title">Release funnel</title>
        <desc id="notemd-gallery-ranked-funnel-release-desc">Use for a ranked hierarchy or conversion drop-off with bounded segments.</desc>
        <style>
