<svg xmlns="http://www.w3.org/2000/svg" width="880" height="560" viewBox="0 0 880 560" role="img" aria-labelledby="notemd-gallery-access-matrix-platform-title notemd-gallery-access-matrix-platform-desc" data-notemd-renderer="notemd-reference-layouts@1.1.0" data-layout-safety="notemd-layout-safety@1.0.0">
        <title id="notemd-gallery-access-matrix-platform-title">Platform access matrix</title>
        <desc id="notemd-gallery-access-matrix-platform-desc">Use to audit which roles can perform which actions on platform components.</desc>
        <style>
