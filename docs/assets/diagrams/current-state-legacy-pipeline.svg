io-target="portal"><path class="ref-edge accent" d="M 710.6666666666666 267.5 H 729 Q 737 267.5 737 259.5 V 190.5 Q 737 182.5 745 182.5 H 762.6666666666666" marker-end="url(#notemd-reference-arrow-accent)"/><text class="ref-edge-label" x="737" y="132.5" text-anchor="middle">XLSX</text></g><g id="reference-edge-3" data-drawio-type="edge" data-drawio-source="portal" data-drawio-target="partners"><path class="ref-edge link dashed" d="M 1064 182.5 H 905 Q 913 182.5 913 190.5 V 259.5 Q 913 267.5 921 267.5 H 762.6666666666666" marker-end="url(#notemd-reference-arrow-link)"/><text class="ref-edge-label" x="913" y="132.5" text-anchor="middle">download</text></g><g id="reference-node-forms" data-drawio-type="node" data-drawio-id="forms" data-drawio-role="component"><rect class="ref-node" x="56" y="150" width="301.3333333333333" height="65" rx="6"/><text x="206.66666666666666" y="170" text-anchor="middle" class="ref-node-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="206.66666666666666" dy="0">Survey forms</tspan></text><text x="206.66666666666666" y="190" text-anchor="middle" class="ref-node-sub" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="206.66666666666666" dy="0">CSV exports</tspan></text></g><g id="reference-node-drive" data-drawio-type="node" data-drawio-id="drive" data-drawio-role="component"><rect class="ref-node focal" x="409.3333333333333" y="150" width="301.3333333333333" height="65" rx="6"/><text x="560" y="170" text-anchor="middle" class="ref-node-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="560" dy="0">Shared drive</tspan></text><text x="560" y="190" text-anchor="middle" class="ref-node-sub" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="560" dy="0">no version control</tspan></text></g><g id="reference-node-analyst" data-drawio-type="node" data-drawio-id="analyst" data-drawio-role="component"><rect class="ref-node" x="409.3333333333333" y="235" width="301.3333333333333" height="65" rx="6"/><text x="5