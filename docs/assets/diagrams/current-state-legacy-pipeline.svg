        <rect class="ref-canvas" x="0" y="0" width="1120" height="640"/>
        <text x="40" y="42" text-anchor="start" class="ref-title" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="40" dy="0">Legacy current state</tspan></text>
        <text x="40" y="66" text-anchor="start" class="ref-summary" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="40" dy="0">A before-state topology with visible manual friction.</tspan></text>
