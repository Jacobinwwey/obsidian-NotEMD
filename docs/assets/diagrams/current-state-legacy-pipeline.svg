<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="640" viewBox="0 0 1120 640" role="img" aria-labelledby="notemd-gallery-current-state-legacy-pipeline-title notemd-gallery-current-state-legacy-pipeline-desc" data-notemd-renderer="notemd-reference-layouts@1.1.0" data-layout-safety="notemd-layout-safety@1.0.0">
        <title id="notemd-gallery-current-state-legacy-pipeline-title">Legacy current state</title>
        <desc id="notemd-gallery-current-state-legacy-pipeline-desc">Use to expose the before-state landscape, manual handoffs, and bottlenecks.</desc>
        <style>
        .ref-canvas { fill: #f8fafc; }
        .ref-title { fill: #172033; font: 700 26px "Segoe UI", Arial, sans-serif; }
        .ref-summary { fill: #64748b; font: 13px "Segoe UI", Arial, sans-serif; }
        .ref-zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
        .ref-zone-label { fill: #64748b; font: 700 10px "Segoe UI", Arial, sans-serif; letter-spacing: 1.5px; }
        .ref-node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
        .ref-node.focal { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.8; }
        .ref-node.external { stroke-dasharray: 5 4; }
        .ref-node-label { fill: #172033; font: 600 13px "Segoe UI", Arial, sans-serif; }
        .ref-header-label { fill: #ffffff; font: 600 11px "Segoe UI", Arial, sans-serif; }
        .ref-node-sub { fill: #64748b; font: 10px Consolas, monospace; }
        .ref-edge { fill: none; stroke: #64748b; stroke-width: 1.5; }
        .ref-edge.accent { stroke: #c2410c; stroke-width: 2; marker-end: url(#notemd-reference-arrow-accent); }
        .ref-edge.link { stroke: #1d4ed8; marker-end: url(#notemd-reference-arrow-link); }
        .ref-edge.trigger { stroke-dasharray: 5 4; }
        .ref-edge.dashed { stroke-dasharray: 5 4; }
        .ref-edge-label { fill: #64748b; font: 10px Consolas, monospace; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; }
        .ref-axis { stroke: #cbd5e1; stroke-width: 1; }
        .ref-axis-label { fill: #64748b; font: 10px Consolas, monospace; }
        .ref-chip { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: .7; }
        .ref-chip-text { fill: #172033; font: 700 8px Consolas, monospace; }
        .ref-focal-fill { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.8; }
        .ref-caption { fill: #64748b; font: 10px Consolas, monospace; letter-spacing: .8px; }
    </style>
        <defs>
        <marker id="notemd-reference-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
