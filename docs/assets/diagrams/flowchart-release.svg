<svg xmlns="http://www.w3.org/2000/svg" width="1048" height="284" viewBox="0 0 1048 284" role="img" aria-labelledby="notemd-gallery-flowchart-release-title notemd-gallery-flowchart-release-desc" data-notemd-renderer="notemd-editable-html-svg@0.1.0">
        <title id="notemd-gallery-flowchart-release-title">Release decision</title>
        <desc id="notemd-gallery-flowchart-release-desc">Use for an ordered process with an explicit decision point.</desc>
        <style>.notemd-editable-svg-canvas {
    fill: var(--notemd-editable-svg-panel, #ffffff);
}
.notemd-editable-svg-title {
    fill: var(--notemd-editable-svg-text, #111827);
    font-size: 26px;
    font-weight: 700;
}
.notemd-editable-svg-summary {
    fill: var(--notemd-editable-svg-muted, #475569);
    font-size: 14px;
}
.notemd-editable-svg-node rect {
    fill: var(--notemd-editable-svg-node-fill, #eff6ff);
    stroke: var(--notemd-editable-svg-border, #cbd5e1);
    stroke-width: 1.5;
}
.notemd-editable-svg-node-label {
    fill: var(--notemd-editable-svg-text, #111827);
    font-size: 15px;
    font-weight: 650;
}
.notemd-editable-svg-node-role {
    fill: var(--notemd-editable-svg-accent, #2563eb);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
}
.notemd-editable-svg-edge path,
.notemd-editable-svg-edge-arrowhead {
    fill: none;
    stroke: var(--notemd-editable-svg-edge, #334155);
    stroke-width: 1.8;
}
.notemd-editable-svg-edge.is-async path {
    stroke-dasharray: 8 6;
}
.notemd-editable-svg-edge-label {
    fill: var(--notemd-editable-svg-muted, #475569);
    paint-order: stroke;
    stroke: var(--notemd-editable-svg-panel, #ffffff);
    stroke-width: 4px;
    font-size: 12px;
    font-weight: 600;
}
marker path {
    fill: var(--notemd-editable-svg-edge, #334155);
}</style>
        <defs>
            <marker id="notemd-editable-svg-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
                <path data-drawio-ignore="marker-shape" d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
            </marker>
        </defs>
        <rect data-drawio-ignore="canvas-background" class="notemd-editable-svg-canvas" x="0" y="0" width="1048" height="284" rx="18" fill="#ffffff"/>
