        <path data-drawio-ignore="part-of-parent-edge" d="M 312 168 C 358 168, 358 168, 404 168" fill="none" stroke="#334155" stroke-width="1.8"/>
    </g><g id="edge-2-tests-to-release" class="notemd-editable-svg-edge" data-drawio-type="edge" data-drawio-id="edge-2-tests-to-release" data-drawio-source="tests" data-drawio-target="release">
        <path data-drawio-ignore="part-of-parent-edge" d="M 644 168 C 690 168, 690 168, 736 168" fill="none" stroke="#334155" stroke-width="1.8"/>
    </g>
