        <rect data-drawio-ignore="part-of-parent-node" x="404" y="116" width="240" height="104" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
        <text data-drawio-ignore="part-of-parent-node" x="524" y="164" text-anchor="middle" class="notemd-editable-svg-node-label">
        <tspan x="524" dy="0">Tests</tspan>
    </text>
        <text data-drawio-ignore="part-of-parent-node" x="524" y="202" text-anchor="middle" class="notemd-editable-svg-node-role" fill="#2563eb">process</text>
    </g><g id="release" class="notemd-editable-svg-node" data-drawio-type="node" data-drawio-role="process" data-drawio-id="release">
        <rect data-drawio-ignore="part-of-parent-node" x="736" y="116" width="240" height="104" rx="14" fill="#eff6ff" stroke="#cbd5e1" stroke-width="1.5"/>
        <text data-drawio-ignore="part-of-parent-node" x="856" y="164" text-anchor="middle" class="notemd-editable-svg-node-label">
        <tspan x="856" dy="0">Release</tspan>
    </text>
        <text data-drawio-ignore="part-of-parent-node" x="856" y="202" text-anchor="middle" class="notemd-editable-svg-node-role" fill="#2563eb">process</text>
    </g>
        <path data-drawio-ignore="edge-arrowhead" class="notemd-editable-svg-edge-arrowhead" d="M 386.000 168.000 L 404 168" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#notemd-editable-svg-arrow)"/><path data-drawio-ignore="edge-arrowhead" class="notemd-editable-svg-edge-arrowhead" d="M 718.000 168.000 L 736 168" fill="none" stroke="#334155" stroke-width="1.8" marker-end="url(#notemd-editable-svg-arrow)"/>
        <text data-drawio-ignore="part-of-parent-edge" x="690" y="158" text-anchor="middle" class="notemd-editable-svg-edge-label" fill="#475569" stroke="#ffffff" stroke-width="4" paint-order="stroke">pass</text>
    </svg>