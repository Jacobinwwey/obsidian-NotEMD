<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1740 508" width="1740" height="508" role="img" aria-labelledby="notemd-gallery-entity-relationship-schema-title notemd-gallery-entity-relationship-schema-desc" style="font-family:Segoe UI,Microsoft YaHei,sans-serif"><title id="notemd-gallery-entity-relationship-schema-title">Artifact schema</title><desc id="notemd-gallery-entity-relationship-schema-desc">Use when entity attributes and cardinality carry the explanation.</desc><style>.er-canvas{fill:var(--er-bg,#f5f8f6)}.er-table{fill:var(--er-panel,#fcfdfb);stroke:var(--er-border,#536d62);stroke-width:1.3}.er-header{fill:var(--er-header,#e0ece5)}.er-title,.er-name,.er-field{fill:var(--er-ink,#173b2e)}.er-title{font-size:28px;font-weight:700}.er-name{font-size:18px;font-weight:650}.er-field{font-size:14px}.er-detail,.er-note{fill:var(--er-muted,#425e52);font-size:12px}.er-rule{stroke:var(--er-rule,#cad8ce);stroke-width:1}.er-edge,.er-cardinality{fill:none;stroke:var(--er-edge,#365c4a);stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}.er-cardinality circle{fill:var(--er-bg,#f5f8f6)}.er-label-bg{fill:var(--er-bg,#f5f8f6)}.er-label{fill:var(--er-ink,#173b2e);font-size:14px}.er-key-bg{fill:var(--er-key-bg,#dfebe3)}.er-key{fill:var(--er-ink,#173b2e);font-size:10px;font-weight:700}.er-unknown{fill:var(--er-ink,#173b2e);stroke:none;font-size:16px;font-weight:700}@media(prefers-color-scheme:dark){svg{--er-bg:#15241e;--er-panel:#1d3027;--er-header:#2a4437;--er-border:#779a85;--er-ink:#e5f1e9;--er-muted:#bed1c4;--er-rule:#486454;--er-edge:#adcbb9;--er-key-bg:#395342}}</style><rect class="er-canvas" width="100%" height="100%" data-drawio-ignore="true"/><g data-drawio-ignore="true"><text class="er-title" x="64" y="62">Artifact schema</text><text class="er-note" x="64" y="93">Source-backed keys, field types and independent relationship endpoints.</text></g><g data-drawio-type="edge" data-drawio-id="er-edge-0" data-drawio-source="artifact" data-drawio-target="panel"><polyline class="er-edge" points="470,260 514,260 514,280 658,280"/><g class="er-cardinality" data-drawio-ignore="true" data-er-cardinality="one" transform="translate(470 260) rotate(0)"><path d="M7 -8V8M14 -8V8"/></g><g class="er-cardinality" data-drawio-ignore="true" data-er-cardinality="zero-or-many" transform="translate(658 280) rotate(180)"><path d="M0 -9L14 0L0 9M0 0H16"/><circle cx="23" cy="0" r="5"/></g><rect class="er-label-bg" x="544" y="252" width="84" height="23" rx="3"/><text class="er-label" x="554" y="268">contains</text></g><g data-drawio-type="edge" data-drawio-id="er-edge-1" data-drawio-source="artifact" data-drawio-target="delivery"><polyline class="er-edge" points="470,300 614,300 614,396 1266,396 1266,280 1306,280" stroke-dasharray="6 5"/><g class="er-cardinality" data-drawio-ignore="true" data-er-cardinality="one" transform="translate(470 300) rotate(0)"><path d="M7 -8V8M14 -8V8"/></g><g class="er-cardinality" data-drawio-ignore="true" data-er-cardinality="zero-or-many" transform="translate(1306 280) rotate(180)"><path d="M0 -9L14 0L0 9M0 0H16"/><circle cx="23" cy="0" r="5"/></g><rect class="er-label-bg" x="490" y="336" width="112" height="23" rx="3"/><text class="er-label" x="500" y="352">delivered as</text></g><g data-er-entity="artifact" data-drawio-type="node" data-drawio-id="artifact" data-drawio-role="entity"><rect class="er-table" x="64" y="160" width="406" height="192" rx="3"/><rect class="er-header" x="64" y="160" width="406" height="48"/><text class="er-name" x="82" y="190">Artifact</text><path data-er-attribute="id" class="er-rule" d="M64 208H470"/><rect class="er-key-bg" x="74" y="217" width="26" height="18" rx="3"/><text class="er-key" x="79" y="230">PK</text><text class="er-field" x="110" y="232">id</text><text class="er-field" x="333" y="232">uuid</text><path data-er-attribute="source_path" class="er-rule" d="M64 244H470"/><rect class="er-key-bg" x="74" y="253" width="26" height="18" rx="3"/><text class="er-key" x="79" y="266">UK</text><text class="er-field" x="110" y="268">source_path</text><text class="er-field" x="333" y="268">varchar(255)</text><text class="er-detail" x="110" y="288">Vault-relative source path</text><path data-er-attribute="created_at" class="er-rule" d="M64 298H470"/><text class="er-field" x="110" y="322">created_at</text><text class="er-field" x="333" y="322">timestamp</text><text class="er-detail" x="110" y="342">Creation time, UTC</text></g><g data-er-entity="panel" data-drawio-type="node" data-drawio-id="panel" data-drawio-role="entity"><rect class="er-table" x="658" y="160" width="460" height="192" rx="3"/><rect class="er-header" x="658" y="160" width="460" height="48"/><text class="er-name" x="676" y="190">Panel</text><path data-er-attribute="artifact_id" class="er-rule" d="M658 208H1118"/><rect class="er-key-bg" x="668" y="217" width="26" height="18" rx="3"/><text class="er-key" x="673" y="230">PK</text><rect class="er-key-bg" x="698" y="217" width="26" height="18" rx="3"/><text class="er-key" x="703" y="230">FK</text><text class="er-field" x="734" y="232">artifact_id</text><text class="er-field" x="981" y="232">uuid</text><text class="er-detail" x="734" y="252">artifact.id</text><path data-er-attribute="position" class="er-rule" d="M658 262H1118"/><rect class="er-key-bg" x="668" y="271" width="26" height="18" rx="3"/><text class="er-key" x="673" y="284">PK</text><text class="er-field" x="734" y="286">position</text><text class="er-field" x="981" y="286">integer</text><text class="er-detail" x="734" y="306">Part of composite primary key</text><path data-er-attribute="caption" class="er-rule" d="M658 316H1118"/><text class="er-field" x="734" y="340">caption</text><text class="er-field" x="981" y="340">varchar(255)</text></g><g data-er-entity="delivery" data-drawio-type="node" data-drawio-id="delivery" data-drawio-role="entity"><rect class="er-table" x="1306" y="160" width="370" height="192" rx="3"/><rect class="er-header" x="1306" y="160" width="370" height="48"/><text class="er-name" x="1324" y="190">Delivery receipt</text><path data-er-attribute="id" class="er-rule" d="M1306 208H1676"/><rect class="er-key-bg" x="1316" y="217" width="26" height="18" rx="3"/><text class="er-key" x="1321" y="230">PK</text><text class="er-field" x="1352" y="232">id</text><text class="er-field" x="1527" y="232">uuid</text><path data-er-attribute="artifact_id" class="er-rule" d="M1306 244H1676"/><rect class="er-key-bg" x="1316" y="253" width="26" height="18" rx="3"/><text class="er-key" x="1321" y="266">FK</text><text class="er-field" x="1352" y="268">artifact_id</text><text class="er-field" x="1527" y="268">uuid</text><text class="er-detail" x="1352" y="288">artifact.id</text><path data-er-attribute="size_kb" class="er-rule" d="M1306 298H1676"/><text class="er-field" x="1352" y="322">size_kb</text><text class="er-field" x="1527" y="322">decimal(12,2)</text><text class="er-detail" x="1352" y="342">Verified output size</text></g><g data-drawio-ignore="true"><text class="er-note" x="64" y="455">PK · primary key    /    FK · foreign key    /    UK · unique key</text><text class="er-note" x="64" y="480">? = unspecified cardinality; solid = identifying; dashed = non-identifying; dotted = status unspecified.</text></g></svg>