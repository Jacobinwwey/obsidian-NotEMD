<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="414" viewBox="0 0 1120 414" role="img" aria-labelledby="notemd-gallery-gantt-release-plan-title notemd-gallery-gantt-release-plan-desc" data-notemd-renderer="notemd-reference-layouts@1.1.0" data-layout-safety="notemd-layout-safety@1.0.0">
        <title id="notemd-gallery-gantt-release-plan-title">Release plan</title>
        <desc id="notemd-gallery-gantt-release-plan-desc">Use for task overlap and milestones on a bounded delivery timeline.</desc>
        <style>
        .ref-canvas { fill: #f8fafc; }
        .ref-title { fill: #172033; font: 700 26px "Segoe UI", Arial, sans-serif; }
        .ref-summary { fill: #475569; font: 13px "Segoe UI", Arial, sans-serif; }
        .ref-zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
        .ref-zone-label { fill: #475569; font: 700 10px "Segoe UI", Arial, sans-serif; letter-spacing: 1.5px; }
        .ref-node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
        .ref-node.focal { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.8; }
        .ref-node.external { stroke-dasharray: 5 4; }
        .ref-node-label { fill: #172033; font: 600 13px "Segoe UI", Arial, sans-serif; }
        .ref-header-label { fill: #ffffff; font: 600 11px "Segoe UI", Arial, sans-serif; }
        .ref-node-sub { fill: #475569; font: 10px Consolas, monospace; }
        .ref-hub-label { fill: #f8fafc; font: 600 13px "Segoe UI", Arial, sans-serif; }
        .ref-hub-sub { fill: #e2e8f0; font: 10px Consolas, monospace; }
        .ref-edge { fill: none; stroke: #475569; stroke-width: 1.5; }
        .ref-edge.accent { stroke: #c2410c; stroke-width: 2; marker-end: url(#notemd-reference-arrow-accent); }
        .ref-edge.link { stroke: #1d4ed8; marker-end: url(#notemd-reference-arrow-link); }
        .ref-edge.trigger { stroke-dasharray: 5 4; }
        .ref-edge.dashed { stroke-dasharray: 5 4; }
        .ref-edge-label { fill: #475569; font: 10px Consolas, monospace; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; }
        .ref-axis { stroke: #cbd5e1; stroke-width: 1; }
        .ref-axis-label { fill: #475569; font: 10px Consolas, monospace; }
        .ref-chip { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: .7; }
        .ref-chip-text { fill: #172033; font: 700 8px Consolas, monospace; }
        .ref-focal-fill { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.8; }
        .ref-caption { fill: #475569; font: 10px Consolas, monospace; letter-spacing: .8px; }
    </style>
        <defs>
        <marker id="notemd-reference-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker>
        <marker id="notemd-reference-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c2410c"/></marker>
        <marker id="notemd-reference-arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1d4ed8"/></marker>
    </defs>
        <rect class="ref-canvas" x="0" y="0" width="1120" height="414"/>
        <text x="40" y="42" text-anchor="start" class="ref-title" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="40" dy="0">Release plan</tspan></text>
        <text x="40" y="66" text-anchor="start" class="ref-summary" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="40" dy="0">A schedule with parallel work and one release gate.</tspan></text>
        <g><line class="ref-axis" x1="260" y1="108" x2="260" y2="344"/><text x="260" y="100" text-anchor="middle" class="ref-axis-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="260" dy="0">W1</tspan></text></g><g><line class="ref-axis" x1="396.66666666666663" y1="108" x2="396.66666666666663" y2="344"/><text x="396.66666666666663" y="100" text-anchor="middle" class="ref-axis-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="396.66666666666663" dy="0">W2</tspan></text></g><g><line class="ref-axis" x1="533.3333333333333" y1="108" x2="533.3333333333333" y2="344"/><text x="533.3333333333333" y="100" text-anchor="middle" class="ref-axis-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="533.3333333333333" dy="0">W3</tspan></text></g><g><line class="ref-axis" x1="670" y1="108" x2="670" y2="344"/><text x="670" y="100" text-anchor="middle" class="ref-axis-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="670" dy="0">W4</tspan></text></g><g><line class="ref-axis" x1="806.6666666666666" y1="108" x2="806.6666666666666" y2="344"/><text x="806.6666666666666" y="100" text-anchor="middle" class="ref-axis-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="806.6666666666666" dy="0">W5</tspan></text></g><g><line class="ref-axis" x1="943.3333333333333" y1="108" x2="943.3333333333333" y2="344"/><text x="943.3333333333333" y="100" text-anchor="middle" class="ref-axis-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="943.3333333333333" dy="0">W6</tspan></text></g><g><line class="ref-axis" x1="1080" y1="108" x2="1080" y2="344"/><text x="1080" y="100" text-anchor="middle" class="ref-axis-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="1080" dy="0">W7</tspan></text></g><g id="reference-task-contract"><text x="18" y="132" text-anchor="start" class="ref-node-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="18" dy="0">Canonical contract</tspan></text><rect class="ref-chip" x="260" y="119" width="291.33333333333326" height="34" rx="5"/><text x="268" y="141" text-anchor="start" class="ref-node-sub" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="268" dy="0">foundation</tspan></text></g><g id="reference-task-renderer"><text x="18" y="190" text-anchor="start" class="ref-node-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="18" dy="0">Native renderer</tspan></text><rect class="ref-focal-fill" x="396.66666666666663" y="177" width="428" height="34" rx="5"/><text x="404.66666666666663" y="199" text-anchor="start" class="ref-node-sub" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="404.66666666666663" dy="0">foundation</tspan></text></g><g id="reference-task-preview"><text x="18" y="248" text-anchor="start" class="ref-node-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="18" dy="0">Preview and gallery</tspan></text><rect class="ref-chip" x="670" y="235" width="291.33333333333326" height="34" rx="5"/><text x="678" y="257" text-anchor="start" class="ref-node-sub" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="678" dy="0">delivery</tspan></text></g><g id="reference-task-release"><text x="18" y="306" text-anchor="start" class="ref-node-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="18" dy="0">Release gate</tspan></text><rect class="ref-chip" x="943.3333333333333" y="293" width="154.66666666666674" height="34" rx="5"/><text x="951.3333333333333" y="315" text-anchor="start" class="ref-node-sub" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="951.3333333333333" dy="0">delivery</tspan></text></g><g id="reference-milestone-gate"><path class="ref-edge accent" d="M 806.6666666666666 108 V 352"/><text x="814.6666666666666" y="372" text-anchor="start" class="ref-edge-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="814.6666666666666" dy="0">consumer gate</tspan></text></g>
    </svg>