<svg xmlns="http://www.w3.org/2000/svg" width="920" height="488" viewBox="0 0 920 488" role="img" aria-labelledby="notemd-gallery-layer-stack-platform-title notemd-gallery-layer-stack-platform-desc" data-notemd-renderer="notemd-reference-layouts@1.1.0" data-layout-safety="notemd-layout-safety@1.0.0">
        <title id="notemd-gallery-layer-stack-platform-title">Platform layers</title>
        <desc id="notemd-gallery-layer-stack-platform-desc">Use for ordered abstraction levels such as application, services, and storage.</desc>
        <style>
        .ref-canvas { fill: #f8fafc; }
        .ref-title { fill: #172033; font: 700 26px "Segoe UI", Arial, sans-serif; }
        .ref-summary { fill: #475569; font: 13px "Segoe UI", Arial, sans-serif; }
        .ref-zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
        .ref-zone-label { fill: #475569; font: 700 10px "Segoe UI", Arial, sans-serif; letter-spacing: 1.5px; }
        .ref-node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
        .ref-node.focal { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.8; }
        .ref-node.external { stroke-dasharray: 5 4; }
        .ref-node-label { fill: #172033; font: 600 13px "Segoe UI", Arial, sans-serif; }
        .ref-header-label { fill: #ffffff; font: 600 11px "Segoe UI", Arial, sans-serif; }
        .ref-node-sub { fill: #475569; font: 10px Consolas, monospace; }
        .ref-hub-label { fill: #f8fafc; font: 600 13px "Segoe UI", Arial, sans-serif; }
        .ref-hub-sub { fill: #e2e8f0; font: 10px Consolas, monospace; }
        .ref-edge { fill: none; stroke: #475569; stroke-width: 1.5; }
        .ref-edge.accent { stroke: #c2410c; stroke-width: 2; marker-end: url(#notemd-reference-arrow-accent); }
        .ref-edge.link { stroke: #1d4ed8; marker-end: url(#notemd-reference-arrow-link); }
        .ref-edge.trigger { stroke-dasharray: 5 4; }
        .ref-edge.dashed { stroke-dasharray: 5 4; }
        .ref-edge-label { fill: #475569; font: 10px Consolas, monospace; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; }
        .ref-axis { stroke: #cbd5e1; stroke-width: 1; }
        .ref-axis-label { fill: #475569; font: 10px Consolas, monospace; }
        .ref-chip { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: .7; }
        .ref-chip-text { fill: #172033; font: 700 8px Consolas, monospace; }
        .ref-focal-fill { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.8; }
        .ref-caption { fill: #475569; font: 10px Consolas, monospace; letter-spacing: .8px; }
    </style>
        <defs>
        <marker id="notemd-reference-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#475569"/></marker>
        <marker id="notemd-reference-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c2410c"/></marker>
        <marker id="notemd-reference-arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1d4ed8"/></marker>
    </defs>
        <rect class="ref-canvas" x="0" y="0" width="920" height="488"/>
        <text x="40" y="42" text-anchor="start" class="ref-title" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="40" dy="0">Platform layers</tspan></text>
        <text x="40" y="66" text-anchor="start" class="ref-summary" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="40" dy="0">Four abstraction layers with one runtime pivot.</tspan></text>
        <text class="ref-caption" x="60" y="94">abstraction ↑</text><g id="reference-layer-storage"><rect class="ref-node" x="60" y="110" width="800" height="77" rx="5"/><text class="ref-caption" x="82" y="138">01</text><text x="130" y="137" text-anchor="start" class="ref-node-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="130" dy="0">Storage</tspan></text><text x="820" y="138" text-anchor="end" class="ref-node-sub" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="820" dy="0">durable state</tspan></text></g><g id="reference-layer-data"><rect class="ref-node" x="60" y="192" width="800" height="77" rx="5"/><text class="ref-caption" x="82" y="220">02</text><text x="130" y="219" text-anchor="start" class="ref-node-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="130" dy="0">Data services</tspan></text><text x="820" y="220" text-anchor="end" class="ref-node-sub" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="820" dy="0">query and transform</tspan></text></g><g id="reference-layer-runtime"><rect class="ref-focal-fill" x="60" y="274" width="800" height="77" rx="5"/><text class="ref-caption" x="82" y="302">03</text><text x="130" y="301" text-anchor="start" class="ref-node-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="130" dy="0">Runtime</tspan></text><text x="820" y="302" text-anchor="end" class="ref-node-sub" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="820" dy="0">orchestration</tspan></text></g><g id="reference-layer-experience"><rect class="ref-node" x="60" y="356" width="800" height="77" rx="5"/><text class="ref-caption" x="82" y="384">04</text><text x="130" y="383" text-anchor="start" class="ref-node-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="130" dy="0">Experience</tspan></text><text x="820" y="384" text-anchor="end" class="ref-node-sub" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="820" dy="0">users and agents</tspan></text></g>
    </svg>