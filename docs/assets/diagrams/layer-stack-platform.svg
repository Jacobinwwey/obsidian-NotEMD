<svg xmlns="http://www.w3.org/2000/svg" width="920" height="416" viewBox="0 0 920 416" role="img" aria-labelledby="notemd-gallery-layer-stack-platform-title notemd-gallery-layer-stack-platform-desc" data-notemd-renderer="notemd-reference-layouts@1.0.0">
        <title id="notemd-gallery-layer-stack-platform-title">Platform layers</title>
        <desc id="notemd-gallery-layer-stack-platform-desc">Use for ordered abstraction levels such as application, services, and storage.</desc>
        <style>
        .ref-canvas { fill: #f8fafc; }
        .ref-title { fill: #172033; font: 700 26px "Segoe UI", Arial, sans-serif; }
        .ref-summary { fill: #64748b; font: 13px "Segoe UI", Arial, sans-serif; }
        .ref-zone { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1; }
        .ref-zone-label { fill: #64748b; font: 700 10px "Segoe UI", Arial, sans-serif; letter-spacing: 1.5px; }
        .ref-node { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.2; }
        .ref-node.focal { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.8; }
        .ref-node.external { stroke-dasharray: 5 4; }
        .ref-node-label { fill: #172033; font: 600 13px "Segoe UI", Arial, sans-serif; }
        .ref-node-sub { fill: #64748b; font: 10px Consolas, monospace; }
        .ref-edge { fill: none; stroke: #64748b; stroke-width: 1.5; }
        .ref-edge.accent { stroke: #c2410c; stroke-width: 2; marker-end: url(#notemd-reference-arrow-accent); }
        .ref-edge.link { stroke: #1d4ed8; marker-end: url(#notemd-reference-arrow-link); }
        .ref-edge.trigger { stroke-dasharray: 5 4; }
        .ref-edge.dashed { stroke-dasharray: 5 4; }
        .ref-edge-label { fill: #64748b; font: 10px Consolas, monospace; paint-order: stroke; stroke: #f8fafc; stroke-width: 5px; }
        .ref-axis { stroke: #cbd5e1; stroke-width: 1; }
        .ref-axis-label { fill: #64748b; font: 10px Consolas, monospace; }
        .ref-chip { fill: #e2e8f0; stroke: #cbd5e1; stroke-width: .7; }
        .ref-chip-text { fill: #172033; font: 700 8px Consolas, monospace; }
        .ref-focal-fill { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.8; }
        .ref-caption { fill: #64748b; font: 10px Consolas, monospace; letter-spacing: .8px; }
    </style>
        <defs>
        <marker id="notemd-reference-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#64748b"/></marker>
        <marker id="notemd-reference-arrow-accent" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#c2410c"/></marker>
        <marker id="notemd-reference-arrow-link" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#1d4ed8"/></marker>
    </defs>
        <rect class="ref-canvas" x="0" y="0" width="920" height="416"/>
        <text class="ref-title" x="40" y="42">Platform layers</text>
        <text class="ref-summary" x="40" y="66">Four abstraction layers with one runtime pivot.</text>
        <text class="ref-caption" x="60" y="94">abstraction ↑</text><g id="reference-layer-storage"><rect class="ref-node" x="60" y="110" width="800" height="59" rx="5"/><text class="ref-caption" x="82" y="136">01</text><text class="ref-node-label" x="130" y="137">Storage</text><text x="820" y="137" text-anchor="end" class="ref-node-sub"><tspan x="820" dy="0">durable state</tspan></text></g><g id="reference-layer-data"><rect class="ref-node" x="60" y="174" width="800" height="59" rx="5"/><text class="ref-caption" x="82" y="200">02</text><text class="ref-node-label" x="130" y="201">Data services</text><text x="820" y="201" text-anchor="end" class="ref-node-sub"><tspan x="820" dy="0">query and transform</tspan></text></g><g id="reference-layer-runtime"><rect class="ref-focal-fill" x="60" y="238" width="800" height="59" rx="5"/><text class="ref-caption" x="82" y="264">03</text><text class="ref-node-label" x="130" y="265">Runtime</text><text x="820" y="265" text-anchor="end" class="ref-node-sub"><tspan x="820" dy="0">orchestration</tspan></text></g><g id="reference-layer-experience"><rect class="ref-node" x="60" y="302" width="800" height="59" rx="5"/><text class="ref-caption" x="82" y="328">04</text><text class="ref-node-label" x="130" y="329">Experience</text><text x="820" y="329" text-anchor="end" class="ref-node-sub"><tspan x="820" dy="0">users and agents</tspan></text></g>
