<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="652" viewBox="0 0 1120 652" role="img" aria-labelledby="notemd-reference-title notemd-reference-desc" data-notemd-renderer="notemd-reference-layouts@1.1.0" data-layout-safety="notemd-layout-safety@1.0.0">
        <title id="notemd-reference-title">High-level platform</title>
        <desc id="notemd-reference-desc">Bounded end-to-end platform overview: external users reach the API, which creates jobs that persist to the data store, and governance policy is linked to the API.</desc>
        <style>
