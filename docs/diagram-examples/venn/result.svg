        <text x="40" y="66" text-anchor="start" class="ref-summary" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="40" dy="0">Three capability sets — Reliable, Editable, Discoverable — with Production capability at the core</tspan><tspan x="40" dy="14">intersection of all three, and Evidence at the overlap of Reliable and Editable.</tspan></text>
        <g id="reference-set-reliable"><circle cx="460" cy="330" r="180" fill="#dbeafe" fill-opacity=".55" stroke="#475569" stroke-width="1.4" /><text x="460" y="126" text-anchor="middle" class="ref-node-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="460" dy="0">Reliable</tspan></text></g><g id="reference-set-editable"><circle cx="585.5736835487436" cy="330" r="180" fill="#dcfce7" fill-opacity=".55" stroke="#475569" stroke-width="1.4" /><text x="585.5736835487436" y="126" text-anchor="middle" class="ref-node-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="585.5736835487436" dy="0">Editable</tspan></text></g><g id="reference-set-discoverable"><circle cx="334.4263164512564" cy="330" r="180" fill="#fef3c7" fill-opacity=".55" stroke="#475569" stroke-width="1.4" /><text x="334.4263164512564" y="126" text-anchor="middle" class="ref-node-label" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="334.4263164512564" dy="0">Discoverable</tspan></text></g><g id="reference-intersection-core"><text class="ref-node-label" x="460" y="313" text-anchor="middle" fill="#c2410c" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="460" dy="0">Production</tspan><tspan x="460" dy="16">capability</tspan></text></g><g id="reference-intersection-re"><text class="ref-caption" x="522.7868417743719" y="347" text-anchor="middle" fill="#172033" data-layout-safety="notemd-layout-safety@1.0.0"><tspan x="522.7868417743719" dy="0">Evidence</tspan></text></g>
