<svg xmlns="http://www.w3.org/2000/svg" width="920" height="620" viewBox="0 0 920 620" role="img" aria-labelledby="notemd-reference-title notemd-reference-desc" data-notemd-renderer="notemd-reference-layouts@1.1.0" data-layout-safety="notemd-layout-safety@1.0.0">
        <title id="notemd-reference-title">Platform fit</title>
        <desc id="notemd-reference-desc">Three capability sets — Reliable, Editable, Discoverable — with Production capability at the core intersection of all three, and Evidence at the overlap of Reliable and Editable.</desc>
        <style>
