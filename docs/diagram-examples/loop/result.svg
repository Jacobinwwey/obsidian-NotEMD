<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" role="img" aria-labelledby="notemd-reference-title notemd-reference-desc" data-notemd-renderer="notemd-reference-layouts@1.1.0" data-layout-safety="notemd-layout-safety@1.0.0">
        <title id="notemd-reference-title">Operating loop</title>
        <desc id="notemd-reference-desc">A reinforcing cycle of six stations that write durable state to a shared record hub: Capture, Research, Decide, Act, Measure, Learn, then return to Capture.</desc>
        <style>
