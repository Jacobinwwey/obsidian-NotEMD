<svg xmlns="http://www.w3.org/2000/svg" width="900" height="730" viewBox="0 0 900 730" role="img" aria-labelledby="notemd-reference-title notemd-reference-desc" data-notemd-renderer="notemd-reference-layouts@1.1.0" data-layout-safety="notemd-layout-safety@1.0.0">
        <title id="notemd-reference-title">Role-scoped data flow</title>
        <desc id="notemd-reference-desc">Admin, engineer, scientist, and consumer roles collaborate across collect, store, transform, analyze, and publish stages. Engineers ingest and prepare raw data; scientists explore and publish findings; consumers query published insights; admins maintain project setup and access policy.</desc>
